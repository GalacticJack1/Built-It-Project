<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Famulus | Library</title>
        <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/afa729a7ce.js" crossorigin="anonymous"></script>
    <script src="spells.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=MedievalSharp&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="library">
        <nav>
            <div class="nav__container">
                <img class="famlogo" src="./assets/famus-logo.png" alt="Famulus Logo">                   
                <ul class=nav__links>
                    <li><a href="" class="nav__link highlight">Home</a></li>
                    <li><a href="" class="nav__link highlight">About</a></li>
                   <li><a href="#contact" class="nav__link nav__link--primary">Contact</a></li>
                   </ul>
            </div>
        </nav>   
        <div class="search__engine--container container__library">
      <div class="search__bar library__nav">
        <input type="text" class="search__bar--area" placeholder="What do you seek?">
        <button class="search__bar--button">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </button>
    </div>
    </div>
    <section id="search__results">
        <div class="spells__header">
            <h3>All <span class="gold medieval">Spells</span></h3>
            <select id="filter">
                <option value disabled selected>Sort</option>
                <option> By Spell level </option>
                <option> By School of Magic</option>
                <option> By Class</option>
                <option> A to Z</option>
                <option> Z to A</option>
            </select>
            </div>
            <div class="spell__library">
                <div id="spell-list"></div>
                <div id="spell-details"></div>
           </div>
    </section>
    </body>
</html>
